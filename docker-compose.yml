name: smartsync

x-backend-build: &backend-build
  context: ./backend
  args:
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    NO_PROXY: ${NO_PROXY:-}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-smartsync}
      MYSQL_USER: ${MYSQL_USER:-smartsync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/init/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  admin-bootstrap:
    image: smartsync-backend:local
    restart: "no"
    entrypoint: ["python", "-m", "scripts.bootstrap_admin"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-smartsync}
      MYSQL_USER: ${MYSQL_USER:-smartsync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  backend:
    image: smartsync-backend:local
    build: *backend-build
    restart: unless-stopped
    init: true
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-smartsync}
      MYSQL_USER: ${MYSQL_USER:-smartsync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-true}
      TINGWU_ENABLED: ${TINGWU_ENABLED:-false}
      TINGWU_ACCESS_KEY_ID: ${TINGWU_ACCESS_KEY_ID:-}
      TINGWU_ACCESS_KEY_SECRET: ${TINGWU_ACCESS_KEY_SECRET:-}
      TINGWU_APP_KEY: ${TINGWU_APP_KEY:-}
      TINGWU_ENDPOINT: ${TINGWU_ENDPOINT:-tingwu.cn-beijing.aliyuncs.com}
      TINGWU_POLL_INTERVAL_SEC: ${TINGWU_POLL_INTERVAL_SEC:-8}
      TINGWU_POLL_TIMEOUT_SEC: ${TINGWU_POLL_TIMEOUT_SEC:-14400}
      TINGWU_S3_ENDPOINT: ${TINGWU_S3_ENDPOINT:-}
      TINGWU_S3_BUCKET: ${TINGWU_S3_BUCKET:-}
      TINGWU_S3_REGION: ${TINGWU_S3_REGION:-auto}
      TINGWU_S3_USER_AGENT: ${TINGWU_S3_USER_AGENT:-SmartSync}
      TINGWU_S3_PUBLIC_URL_BASE: ${TINGWU_S3_PUBLIC_URL_BASE:-}
      TINGWU_S3_PREFIX: ${TINGWU_S3_PREFIX:-smartsync/tingwu}
      TINGWU_S3_URL_EXPIRES_SEC: ${TINGWU_S3_URL_EXPIRES_SEC:-14400}
      TINGWU_S3_ACCESS_KEY_ID: ${TINGWU_S3_ACCESS_KEY_ID:-}
      TINGWU_S3_ACCESS_KEY_SECRET: ${TINGWU_S3_ACCESS_KEY_SECRET:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SmartSync <noreply@example.com>}
      DEBUG: ${DEBUG:-false}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      admin-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-9090}:80"
    volumes:
      - ./nginx/nginx.server.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mysql_data:
  uploads_data:
